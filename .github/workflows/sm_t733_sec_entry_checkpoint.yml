name: SM-T733 SEC entry checkpoint - NOT UEFI runtime
on:
  push:
    branches: [codex/sm-t733-sec-entry-checkpoint]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t733-entry-checkpoint-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-fd-only:
    strategy:
      fail-fast: false
      matrix:
        seconds: [12, 3]
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install disposable container prerequisites
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y build-essential git ca-certificates curl python3 python3-venv python3-pip file xz-utils
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Prepare isolated build paths
        run: |
          set -euo pipefail
          mkdir -p /workspace/.cloud-setup/logs
          ln -s "$GITHUB_WORKSPACE" /workspace/mu_aloha_platforms
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory /workspace/mu_aloha_platforms
      - name: Prepare pinned dependencies and compiler
        working-directory: /workspace/mu_aloha_platforms
        run: |
          set -euo pipefail
          bash Codex-Offline-Work/tools/setup-cloud.sh 2>&1 | tee /workspace/.cloud-setup/logs/retained-setup.log
      - name: Select checkpoint delay and record actual source
        working-directory: /workspace/mu_aloha_platforms
        run: |
          set -euo pipefail
          python3 BootShim/sec-entry-checkpoint/configure_delay.py --seconds ${{ matrix.seconds }} > /workspace/.cloud-setup/logs/checkpoint-source-inputs.json
      - name: Rebuild checkpoint FD - never normal UEFI
        working-directory: /workspace/mu_aloha_platforms
        run: |
          set -euo pipefail
          source Codex-Offline-Work/tools/activate.sh
          stuart_build -c Platforms/KodiakPkg/PlatformBuildT733RetainedSec.py TARGET=RELEASE TARGET_DEVICE=samsung-gts7fewifi MAX_CONCURRENT_THREAD_NUMBER=4
          cp Platforms/AndromedaPkg/PrePi/AArch64/ModuleEntryPoint.S Build/KodiakT733RetainedSec/actual-checkpoint-entry.S
          cp /workspace/.cloud-setup/logs/checkpoint-source-inputs.json Build/KodiakT733RetainedSec/checkpoint-source-inputs.json
          git diff -- Platforms/AndromedaPkg/PrePi/AArch64/ModuleEntryPoint.S > Build/KodiakT733RetainedSec/declared-source-diff.txt
          git rev-parse HEAD > Build/KodiakT733RetainedSec/source-head.txt
          git submodule status --recursive > Build/KodiakT733RetainedSec/submodules.txt
      - name: Retain FD and audit as HOLD artifacts
        uses: actions/upload-artifact@v4
        with:
          name: T733-SEC-ENTRY-${{ matrix.seconds }}S-NOT-UEFI-RUNTIME-HOLD
          if-no-files-found: error
          path: |
            Build/KodiakT733RetainedSec/RELEASE_CLANGPDB/FV/SM7325_EFI.fd
            Build/KodiakT733RetainedSec/RELEASE_CLANGPDB/FV/retained-sec-audit.json
            Build/KodiakT733RetainedSec/actual-checkpoint-entry.S
            Build/KodiakT733RetainedSec/checkpoint-source-inputs.json
            Build/KodiakT733RetainedSec/declared-source-diff.txt
            Build/KodiakT733RetainedSec/source-head.txt
            Build/KodiakT733RetainedSec/submodules.txt
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T733-SEC-ENTRY-${{ matrix.seconds }}S-LOGS
          path: |
            /workspace/.cloud-setup/logs/
            Build/BUILDLOG*.txt
